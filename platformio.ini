[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800

lib_deps =
    adafruit/Adafruit GFX Library @ ^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.3
    adafruit/Adafruit BusIO @ ^1.16.1

; Pins can be passed from here instead of editing main.cpp
build_flags =
    -D PIN_SCL=18
    -D PIN_SDA=23
    -D PIN_CS=5
    -D PIN_DC=27
    -D PIN_RST=26
    -D SPI_HZ=20000000
    -D GPS_RX_PIN=16
    -D GPS_TX_PIN=17
